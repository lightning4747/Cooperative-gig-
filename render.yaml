databases:
  - name: cooperative-postgres
    databaseName: cooperative
    user: cooperative
    plan: free
    region: oregon

services:
  # Spring Boot Java 21 Backend API
  - type: web
    name: cooperativegig-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      - key: DATABASE_URL
        fromDatabase:
          name: cooperative-postgres
          property: connectionString
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: cooperative-postgres
          property: password
      - key: CORS_ORIGINS
        value: "*"
      - key: BOOTSTRAP_ADMIN_PHONE
        value: "+919876543200"

  # Vite + React 19 Frontend
  - type: web
    name: cooperativegig-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
