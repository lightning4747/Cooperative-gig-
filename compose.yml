services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: cooperative
      POSTGRES_USER: cooperative
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-cooperative-dev-only}
    ports: ["127.0.0.1:${DATABASE_PORT:-5432}:5432"]
    volumes: ["cooperative-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cooperative -d cooperative"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  api:
    build: ./backend
    ports: ["127.0.0.1:8080:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://db:5432/cooperative
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-cooperative-dev-only}
      BOOTSTRAP_ADMIN_PHONE: ${BOOTSTRAP_ADMIN_PHONE:-+919999999999}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports: ["${FRONTEND_PORT:-3000}:80"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cooperative-data:
